name: Screenshot

on:
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: アプリ起動からスクリーンショットを撮るまでの待機秒数
        required: false
        default: "45"
      device:
        description: スクリーンショットを撮るシミュレータ
        required: false
        default: iPhone 17 Pro Max
      dry_run:
        description: App Store Connect にはアップロードせず、撮影したスクリーンショットの確認だけ行う
        type: boolean
        required: false
        default: false

jobs:
  screenshot:
    name: Screenshot
    runs-on: macos-latest

    env:
      PROJECT: LainTSXApp.xcodeproj
      SCHEME: LainTSXApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set Environment
        run: |
          set -euo pipefail
          # grep -m1 のように途中で読むのをやめるとパイプ元が SIGPIPE で死に、pipefail に引っかかる。
          # いったん全部受け取ってから取り出す。
          settings=$(xcodebuild -showBuildSettings -project "$PROJECT" -scheme "$SCHEME")
          bundle_id=$(awk '$1 == "PRODUCT_BUNDLE_IDENTIFIER" && !found { print $3; found = 1 }' <<< "$settings")
          if [ -z "$bundle_id" ]; then
            echo "::error::PRODUCT_BUNDLE_IDENTIFIER が取れなかった"
            exit 1
          fi
          echo "BUNDLE_ID=$bundle_id" >> $GITHUB_ENV
          echo "bundle id: $bundle_id"

      - name: Capture Screenshots
        run: |
          if ! xcrun simctl list devices available | grep -q "^ *${{ inputs.device }} ("; then
            echo "シミュレータ '${{ inputs.device }}' がランナーにありません。利用できるのは以下です。"
            xcrun simctl list devices available
            exit 1
          fi

          xcrun simctl boot "${{ inputs.device }}" || true
          xcrun simctl bootstatus "${{ inputs.device }}" -b

          # simctl からはデバイスを回転させられないため、対応する向きを 1 つに絞ってビルドし、
          # その向きでしか表示できないアプリとして起動させる
          capture() {
            orientations="$1"
            output="$2"

            xcodebuild build -project "$PROJECT" \
                             -scheme "$SCHEME" \
                             -configuration Debug \
                             -destination "platform=iOS Simulator,name=${{ inputs.device }}" \
                             -derivedDataPath build \
                             INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone="$orientations" \
                             INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad="$orientations"

            app_path=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
            xcrun simctl terminate booted "$BUNDLE_ID" || true
            xcrun simctl uninstall booted "$BUNDLE_ID" || true
            xcrun simctl install booted "$app_path"
            xcrun simctl launch booted "$BUNDLE_ID"

            # ゲームの読み込みが終わるのを待ってから撮る
            sleep ${{ inputs.wait_seconds }}
            xcrun simctl io booted screenshot "$output"
            sips -g pixelWidth -g pixelHeight "$output"
          }

          capture "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight" landscape.png
          capture "UIInterfaceOrientationPortrait" portrait.png

      - name: Upload Screenshots to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            landscape.png
            portrait.png

      - name: Create Private Key
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8

      - name: Upload Screenshot to App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_KEY_PATH: private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8
          # 並べた順が App Store Connect 上の表示順になる
          SCREENSHOT_PATHS: landscape.png,portrait.png
        run: ruby scripts/upload_screenshot.rb
