name: Release/develop

on:
  push:
    branches: develop

jobs:          
  build:
    name: Release/develop
    runs-on: macos-latest

    env:
      PROJECT: LainTSXApp.xcodeproj
      SCHEME: LainTSXApp

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4

      - name: ci_post_clone
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Archive Project
        run: |
          set -euo pipefail
          xcodebuild archive -project "$PROJECT" \
                             -scheme "$SCHEME" \
                             -sdk iphoneos \
                             -configuration Release \
                             -archivePath build.xcarchive \
                              CURRENT_PROJECT_VERSION=`date -u +%Y%m%d%H%M` \
                              CODE_SIGNING_ALLOWED=NO

      - name: Create ExportOptions.plist
        run: |
          set -euo pipefail
          echo '${{ secrets.EXPORT_OPTIONS }}' > ExportOptions.plist
          # Xcode に任せると App Store Connect の既存ビルドと番号が衝突するため、
          # アーカイブ時に設定したビルド番号をそのまま使う
          /usr/libexec/PlistBuddy -c "Delete :manageAppVersionAndBuildNumber" ExportOptions.plist || true
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" ExportOptions.plist

      - name: Create Private Key
        run: |
          set -euo pipefail
          mkdir private_keys
          echo -n '${{ secrets.APPLE_API_KEY_BASE64 }}' | base64 --decode > ./private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
                     -archivePath build.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath app.ipa \
                     -allowProvisioningUpdates \
                     -authenticationKeyPath `pwd`/private_keys/AuthKey_${{ secrets.APPLE_API_ISSUER_ID }}.p8 \
                     -authenticationKeyID ${{ secrets.APPLE_API_KEY_ID }} \
                     -authenticationKeyIssuerID ${{ secrets.APPLE_API_ISSUER_ID }}

      - name: Upload IPA file to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f app.ipa/${{ env.SCHEME }}.ipa \
                      -u ${{ secrets.APPLE_ID }} \
                      -p ${{ secrets.APP_SPECIFIC_PASSWORD }} \
                      --type ios

      - name: Upload IPA file to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}.ipa
          path: app.ipa/${{ env.SCHEME }}.ipa